[[divergence]]
id = "ops/case/case_lines@2:8/g~e"
buffer = "body"
expect = { lines = ["ß ǅ", "  straßE", "", "iI ǈ"], cursor = [2, 8] }
who = "you"
why = "Vim's op_tilde counts bytes: İ and ı shrink from 2 bytes to 1 when re-cased, so its walk stops before the range's end byte and carries on, re-casing ǈ outside the range (and its undo does not restore that). User decided 2026-09-30: case ops re-case only their range, char by char; undo exact."

