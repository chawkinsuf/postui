# '^ through undo (R2, plan 3c Deviation 21): an Insert session whose line
# count changed and changed back (`<CR>` then `<Del>`) is two undo entries in
# Vim and one step in the engine, so `u` deletes Vim's '^ (gi starts at the
# caret) and the engine keeps it. Pending the user's confirmation of plan
# 3c's drop. Runs where Vim keeps '^ on the same row too need no entry.

[[divergence]]
id = "insert/gi/blank_edges@1:1/A<CR><Del><Esc>uGgiY<Esc>"
buffer = "body"
expect = { lines = ["", "Ya", "", "  b  ", ""], cursor = [2, 1] }
who = "mine"
why = "Vim moves '^ once per undo entry and this Insert session holds two (the Enter, then the Del that joined back), so its undo deletes the mark and gi starts at the caret; the engine moves marks by the step's net line change and keeps it. Parked at 3b's final review (R2); the user ruled 2026-09-30 that the undo-exact rule covers edited text, not '^. Plan 3c (2026-10-01) assumed the drop rather than port Vim's undo-entry merging, pending the user's confirmation."

