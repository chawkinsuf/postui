# Intentional differences from Vim 9.1 (spec §6.6). Each entry replaces the
# golden expectation for the runs it matches. The conformance test fails if
# an entry matches no case, or if the engine already matches Vim on a listed
# case, so stale entries can't pile up. Target at the first release: none.
#
# [[divergence]]
# id = "objects/quote/quotes@1:9/di\""     # an exact id, or a glob with *
# buffer = "both"                          # body | one-line | both
# expect = { lines = ["…"], cursor = [1, 9] }   # or: skip = true
# who = "mine"                             # you | mine | earlier
# why = "…"

# Plan 3b Task 2: Vim's op_tilde() counts bytes (case.rs history, task-2
# report). Each entry below is that one quirk.

[[divergence]]
id = "ops/case/case_lines@1:2/gUj"
buffer = "body"
expect = { lines = ["SS Ǆ", "  STRASSE", "", "İı ǈ"], cursor = [1, 2] }
who = "you"
why = "Vim's op_tilde counts bytes and never moves the cursor, so it keeps the old byte offset: ß becoming SS changes the char count before the caret and Vim lands one char right. User decided 2026-09-30: case ops re-case only their range, char by char; the caret goes to the range start; undo exact."

