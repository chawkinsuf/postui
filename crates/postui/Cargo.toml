[package]
name = "postui"
edition.workspace = true
version.workspace = true

[dependencies]
postui-core = { path = "../postui-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
directories.workspace = true
indexmap.workspace = true
tempfile.workspace = true
edtui = { version = "0.11", default-features = false, features = ["syntax-highlighting", "mouse-support"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
arboard = "3"
base64 = "0.22"
# Char display widths, for mapping body-editor clicks back onto buffer
# columns exactly the way edtui lays the text out (it uses this same crate).
unicode-width = "0.2"
# Raw poll(2)/read(2) on stdin for the OSC terminal-color query
# (theme/osc.rs). Deliberately bypasses crossterm's event machinery: on
# unix, crossterm's own `poll`/`read` consume bytes from fd 0 into its
# internal parser, which would swallow our OSC/DA1 replies before we could
# see them. Version pinned to match crossterm's existing transitive `rustix`
# dependency so `cargo tree` shows a single copy.
rustix = { version = "1.1", features = ["event"] }

[features]
# Exposes test-only helpers (e.g. `Clipboard::new_for_test`,
# `App::set_clipboard_for_test`) that are otherwise `#[cfg(test)]`-only and
# so invisible to integration tests under `tests/`, which compile against
# this crate as an ordinary dependency. Enabled automatically for `cargo
# test` via the dev-dependency below; never enabled for a plain build.
test-util = []

[dev-dependencies]
wiremock = "0.6"
# Re-declares this crate as its own dev-dependency with `test-util` on, so
# integration tests get the feature-gated test helpers without callers
# having to pass `--features test-util` by hand.
postui = { path = ".", features = ["test-util"] }
