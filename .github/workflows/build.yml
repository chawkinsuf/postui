name: build

# Branches merge into main locally (--no-ff) and main is what gets pushed,
# so main is the branch these gates watch; there are no pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The jobs only read the code.
permissions:
  contents: read

jobs:
  # fmt, clippy and the tests, defined once in checks.yml so a release tag
  # runs exactly the same gates (release.yml calls it too).
  #
  # Binaries come only from release.yml (dist), on a version tag: there is
  # no per-push build here. A push builds nothing to download; to try a
  # build before a release, cut a prerelease: set the workspace version to
  # e.g. 0.2.0-rc.1 (the tag must match it), merge, and tag v0.2.0-rc.1.
  # dist publishes it as a GitHub prerelease and keeps it out of the
  # Homebrew tap (docs/releasing.md, "Prereleases").
  check:
    uses: ./.github/workflows/checks.yml
