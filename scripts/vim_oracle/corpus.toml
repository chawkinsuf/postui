# The Vim conformance corpus (spec §6.2). Each [[group]] expands to
# keys × suffixes × texts (`on`) × seats (`at`); `python3
# scripts/vim_oracle/generate.py` runs every case through Vim 9.1 and writes
# crates/postui/tests/vim_conformance/golden.jsonl.
#
# Seats: "bol" "fnb" "mid" "eol" (for each line; texts over 12 lines use the
# first, middle and last), "each" (every char of every line, texts of at most
# 12 lines), "empty" (the first empty line), or [row, col] (1-based chars;
# skipped where the text has no such char). Default: ["bol", "mid", "eol"].
# Keys use Vim notation; <Name>s must be listed in keys.toml. A case may not
# end half-typed, uses '.' only after a change, and never holds : Q K q @ ! &
# or ZZ/ZQ: if a change fails, its typed text runs as Normal commands, so
# typed text uses harmless letters like X and Y.
# status = "later" cases are generated and reported but do not fail the test.
# Budget: the full 3a corpus is about 40,000 cases and 6.75 MB of golden file
# (measured 2026-09-30); plan 3b's first wave adds about 13,000 cases. Keep it
# under about 9 MB. Prefer named seats unless the key's result depends on the
# char under the caret.

[text.words]
lines = ["foo bar  baz_qux.quux end"]

[text.punct]
lines = ["foo.bar(baz, qux);"]

[text.url]
lines = ["https://api.example.com/v1/users?id=42&name=a%20b#top"]

[text.json_flat]
lines = ['{"a": {"b": 1}, "c": [1, 2], "d": "x y"}']

[text.json_pretty]
lines = ['{', '  "a": {"b": 1},', '  "c": [1, 2, 3],', '  "d": "hello world"', '}']

[text.json_gaps]
lines = ['{', '  "a": 1,', '', '  "b": [', '    2', '  ],', '', '', '  "c": 3', '}']

[text.brackets_deep]
lines = ['f(a[b{c(d)e}f]g)h', '(x [y', '  {z}] w)']

[text.quotes]
lines = ['say "hi" and "a \"b\" c" or "" then', '"k": "v", "k2": "(v2}"', "x = 'one' + 'two'"]

[text.unicode]
lines = ["héllo wörld 日本語 😀 x×y a b"]

[text.blank_edges]
lines = ["", "a", "", "  b  ", ""]

[text.one_char]
lines = ["x"]

[text.empty]
lines = [""]

[text.numbers]
lines = ["id: 41, n: -7, hex: 0x1f, pad: 007"]

[text.tabs]
lines = ["\tone two", "\t\tthree", "four"]

[text.short_last]
lines = ["abcdefgh", "abc"]

# --- harness ---------------------------------------------------------------

[[group]]
id = "harness/smoke"
tier = 1
keys = ["<Esc>", "<Esc><Esc>"]
on = ["words", "punct", "url", "json_flat", "json_pretty", "json_gaps", "brackets_deep",
      "quotes", "unicode", "blank_edges", "one_char", "empty", "numbers", "tabs"]
at = ["bol", "mid", "eol"]

[[group]]
id = "harness/reg"
tier = 1
keys = ["<Esc>"]
on = ["words", "json_pretty"]
at = [[1, 1]]
reg = { text = "q\n", type = "V" }

# --- motions (Task 6) --------------------------------------------------------

[[group]]
id = "motions/hl"
tier = 1
keys = ["h", "l", "3h", "3l", "9l", "<Left>", "<Right>", "<BS>", "<Space>", "3<BS>", "3<Space>",
        "9<Space>", "9<BS>", "lh"]
on = ["words", "json_flat", "unicode", "json_pretty", "blank_edges", "one_char", "empty", "tabs"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "motions/jk"
tier = 1
keys = ["j", "k", "3j", "3k", "9j", "9k", "<Down>", "<Up>", "jj", "jk", "$j", "$jk", "llj", "lljj",
        "0j", "$jj", "$wk", "$ek", "kbj", "2$k", "9$k", "l2$k", "$%k", "$fzk", "$3bj", "j<C-r>k", "juk"]
on = ["json_pretty", "json_gaps", "blank_edges", "tabs", "brackets_deep", "words", "json_flat", "unicode",
      "short_last"]
at = ["bol", "mid", "eol"]

[[group]]
id = "motions/line"
tier = 1
keys = ["0", "^", "$", "<Home>", "<End>", "2$", "3$", "9$", "$0", "10l0", "$^"]
on = ["words", "json_flat", "json_pretty", "blank_edges", "tabs", "unicode"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "motions/file"
tier = 1
keys = ["gg", "G", "2G", "2gg", "9G", "9gg", "Gk", "ggj", "3G$", "G$gg"]
on = ["json_pretty", "json_gaps", "blank_edges", "tabs", "words", "json_flat", "unicode"]
at = ["bol", "mid", "eol"]

[[group]]
id = "motions/word"
tier = 1
keys = ["w", "b", "e", "W", "B", "E", "3w", "3b", "3e", "2W", "2B", "2E", "9w", "9b", "9e", "ee", "bb"]
on = ["words", "punct", "unicode", "json_flat"]
at = ["each"]

[[group]]
id = "motions/word-lines"
tier = 1
keys = ["w", "b", "e", "W", "B", "E", "3w", "3b", "3e", "9w", "9b", "9e"]
on = ["json_pretty", "blank_edges", "json_gaps", "tabs", "url"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "motions/find"
tier = 1
keys = ["f<Space>", "F<Space>", "t<Space>", "T<Space>", "2f<Space>", "2t<Space>", "3F<Space>", "fa",
        "ta;", "fa;", "fa;;", "fa,", "ta,", "Ta;", "Ta,", "f,;", "t,;", "t,,", "t,2;", ";", ",",
        "f\"", "t\"", "fz", "2fz", "f<Tab>"]
on = ["words", "punct", "url", "json_flat", "json_pretty", "blank_edges", "quotes", "unicode", "tabs"]
at = ["bol", "mid", "eol"]

[[group]]
id = "motions/percent"
tier = 1
keys = ["%", "%%", "l%", "$%", "w%"]
on = ["json_flat", "brackets_deep", "quotes", "punct"]
at = ["each"]

[[group]]
id = "motions/percent-lines"
tier = 1
keys = ["%", "%%", "50%", "100%", "1%", "200%"]
on = ["json_pretty", "json_gaps", "blank_edges", "words", "unicode"]
at = ["bol", "fnb", "mid", "eol"]

# --- operators: delete, yank, undo (Task 7) ----------------------------------

[[group]]
