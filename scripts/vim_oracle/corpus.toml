# --- put, replace, join (Task 10) --------------------------------------------

[[group]]
id = "ops/put-char"
tier = 1
keys = ["p", "P", "2p", "3P", "pp", "pu", "pu<C-r>", "Pu", "Pu<C-r>"]
on = ["words", "json_flat", "json_pretty", "blank_edges", "empty", "one_char", "unicode"]
at = ["bol", "fnb", "mid", "eol"]
reg = { text = "Q", type = "v" }

[[group]]
id = "ops/put-line"
tier = 1
keys = ["p", "P", "2p", "3P", "pp", "pu", "pu<C-r>", "Pu", "Pu<C-r>"]
on = ["words", "json_flat", "json_pretty", "blank_edges", "unicode", "empty", "one_char"]
at = ["bol", "fnb", "mid", "eol"]
reg = { text = "  q\n", type = "V" }

[[group]]
id = "ops/put-multi"
tier = 1
keys = ["p", "P", "2p", "pu"]
on = ["words", "json_pretty", "blank_edges", "empty"]
at = ["bol", "mid", "eol"]
reg = { text = "a\nb", type = "v" }

# The unnamed register holds "" (as the engine's does at start): Vim's
# `do_put` still saves the line for undo and resets the wanted column.
[[group]]
id = "ops/put-empty"
tier = 1
keys = ["p", "P", "3p", "pu", "Pu<C-r>", "jPj", "pjuj", "xpuu"]
on = ["words", "short_last", "brackets_deep", "blank_edges", "empty"]
at = ["bol", "mid", "eol"]

[[group]]
id = "ops/yank-put"
tier = 1
keys = ["yyp", "yyP", "3yyp", "ywP", "yw$p", "yiwP", "dwwP", "xp", "ddp", "ddP", "Yp", "y$P", "yjp",
        "yj$p", "2yy3p", "dd2P", "yawp"]
on = ["words", "json_flat", "json_pretty", "blank_edges", "unicode"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "ops/replace"
tier = 1
keys = ["rX", "3rX", "9rX", "r<Tab>", "rXu", "3rXu<C-r>", "rX$rY", "r<Space>", "2r日"]
on = ["words", "json_flat", "json_pretty", "blank_edges", "unicode", "empty", "one_char"]
at = ["bol", "mid", "eol"]

[[group]]
id = "ops/join"
tier = 1
keys = ["J", "3J", "9J", "JJ", "Ju", "Ju<C-r>", "2J", "4J"]
on = ["json_pretty", "blank_edges", "json_gaps", "tabs", "brackets_deep", "words", "json_flat", "unicode", "quotes"]
at = ["bol", "mid", "eol"]

# `r`, `p`, `P` and `J` reset the wanted column like any other command, even
# when the caret stays put (`jrXj` differs from `jj` under a short line);
# `{N}r<Tab>` is Vim's `{N}R<Tab><Esc>` under 'expandtab'.
[[group]]
id = "ops/replace-more"
tier = 1
keys = ["jrXj", "$jrXj", "j3rXj", "krXk", "jpj", "jPj", "$Jj", "jJj", "jr<Tab>j", "rX", "r<Tab>",
        "2r<Tab>", "3r<Tab>u", "9Ju", "9Ju<C-r>", "jJk"]
on = ["brackets_deep", "json_gaps", "tabs", "json_pretty", "short_last"]
at = ["bol", "mid", "eol"]
reg = { text = "Q", type = "v" }

# `r` that puts back the same chars is still an undo step (`nv_replace`
# saves the line first): [1, 4] on words and [2, 2] on json_pretty are
# spaces where `r<Tab>` gives one space.
[[group]]
id = "ops/replace-same"
tier = 1
keys = ["rXrXu", "rXrXu<C-r>", "r<Space>u", "xr<Space>u", "r<Tab>u", "r<Tab>u<C-r>", "2r<Space>u"]
on = ["words", "json_pretty"]
at = ["bol", "fnb", "mid", "eol", [1, 4], [2, 2]]

# --- Visual (Task 11) --------------------------------------------------------

[[group]]
id = "visual/select"
tier = 1
keys = ["v", "vl", "vj", "v$", "vw", "ve", "vb", "V", "Vj", "Vk", "vjo", "vllo", "vlloh", "vV", "Vv",
        "vv", "VV", "v<Esc>", "V<Esc>", "v$j", "vG", "Vgg", "v3l", "v%", "vfa", "vl<Esc>l"]
on = ["words", "json_pretty", "blank_edges", "json_flat", "unicode", "tabs"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "visual/objects"
tier = 1
keys = ["viw", "vaw", "v2iw", "viwiw", "vawaw", "viW", "vi\"", "va\"", "vi\"i\"", "vi{", "va{", "vi{i{",
        "va{a{", "vi(", "vi[", "Viw", "vlliw", "vhhiw", "v2i{", "vi'"]
on = ["words", "json_flat", "json_pretty", "brackets_deep", "quotes", "unicode", "blank_edges"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "visual/ops"
tier = 1
keys = ["vld", "vjd", "v$d", "Vd", "Vjd", "vlcX<Esc>", "VjcX<Esc>", "vly", "Vy", "vjy", "vlx", "vlX",
        "vlD", "vlY", "vlCX<Esc>", "vlsX<Esc>", "vlSX<Esc>", "vlRX<Esc>", "vlrX", "VjrX", "vjrX", "VjJ",
        "vjJ", "VJ", "vJ", "vl~", "vlu", "vlU", "Vj~", "Vj>", "Vj<", "v>", "Vj2>", "V3<", "viwd", "vi{d",
        "va\"d", "vi{y", "vd", "Vjjd", "Vk~", "VkU"]
on = ["words", "json_flat", "json_pretty", "blank_edges", "tabs", "unicode"]
at = ["bol", "fnb", "mid", "eol"]

# Spec §6.2: Visual `u` and `U` get `u` and `u<C-r>` cases too.
[[group]]
id = "visual/undo"
tier = 1
keys = ["vjd", "v$d", "Vjd", "VjcX<Esc>", "vlrX", "VjJ", "Vj>", "vl~", "vlu", "vlU", "vju", "vjU", "VjU"]
suffixes = ["u", "u<C-r>"]
on = ["words", "json_pretty", "blank_edges", "tabs"]
at = ["bol", "fnb", "eol"]

# A Visual command that leaves the text as it was is still an undo step
# (Vim saves the lines first): `~` `U` on a `-`, `u` on lowercase text, `<`
# with no indent, `>` on an empty line, `r` with the same char. `r-` (or
# `rX` on blank_edges' "a") first makes a real change, so `u` shows which
# step it undid.
[[group]]
id = "visual/undo-same"
tier = 1
keys = ["r-v~", "r-vlu", "r-vU", "r-V<", "r-vr-"]
suffixes = ["u", "u<C-r>"]
on = ["words"]
at = ["bol", "fnb", "mid", "eol", [1, 4]]

[[group]]
id = "visual/undo-same-lines"
tier = 1
keys = ["ggjrXjV>", "ggjrXGV<", "ggjrXjv~", "ggjrXGvU"]
suffixes = ["u", "u<C-r>"]
on = ["blank_edges"]
at = ["bol"]

[[group]]
id = "visual/put-char"
tier = 1
keys = ["vlp", "vlP", "Vp", "VP", "viwp", "Vjp", "v$p", "vjp", "vl2p", "ggVGp"]
on = ["words", "json_pretty", "blank_edges", "one_char"]
at = ["bol", "fnb", "mid", "eol"]
reg = { text = "Q", type = "v" }

[[group]]
id = "visual/put-line"
tier = 1
keys = ["vlp", "vlP", "Vp", "VP", "viwp", "Vjp", "v$p", "vjp", "vl2p", "ggVGp"]
on = ["words", "json_pretty", "blank_edges", "one_char"]
at = ["bol", "fnb", "mid", "eol"]
reg = { text = "  q\n", type = "V" }

# Visual `p`/`P` once every line is gone (Vim's ML_EMPTY): nothing to
# delete, but the put still runs, and no stray empty last line is left.
[[group]]
id = "visual/put-emptied"
tier = 1
keys = ["VdVp", "Vdvp", "VdVP", "yyVdvp", "ggVGdVp", "ggVGdvp"]
on = ["words", "json_pretty", "one_char", "empty"]
at = ["bol"]

# Leaving Visual and the wanted column (Vim's cached w_virtcol): `v`/`V`
# keep w_curswant, `Esc` rereads w_virtcol, which is recomputed only where
# the caret moves, in the mode of the moment (a tab's first or last cell).
[[group]]
id = "visual/exit-want"
tier = 1
keys = ["vj<Esc>k", "vk<Esc>j", "vjk<Esc>j", "v0<Esc>j", "vh<Esc>j", "vlo<Esc>k", "vlo<Esc>j", "vlovk",
        "vkvj", "vkVVj", "v$vk", "v$<Esc>k", "Vk<Esc>j"]
on = ["tabs", "short_last", "json_pretty"]
at = ["bol", "eol", [1, 2], [2, 2], [3, 4], [4, 19]]

# The same cache is recomputed when Insert starts or ends and after any
# undo or redo, even of a step that changed nothing.
[[group]]
id = "visual/virtcol"
tier = 1
keys = ["i<Down>", "i<Up>", "i<Esc>i<Down>", "v<Esc>i<Down>", "iX<BS><Esc>j", "a<Left><Esc>j",
        "vhc<Esc>j", "vh~uj"]
on = ["tabs"]
at = [[2, 1], [2, 2]]

[[group]]
id = "visual/yank-put"
tier = 1
keys = ["yiwwviwp", "yiwwviwP$p", "yiwwviwp$p", "yywVp", "yyjVP", "Vyp", "vly$p", "vjyP"]
on = ["words", "json_pretty", "blank_edges"]
at = ["bol", "fnb", "mid", "eol"]

# --- dot repeat (Task 12) ----------------------------------------------------

# `{N}.` replaces the stored count, and the replay records that count for
# the next `.` (`dw3..`). A change that ran sets `.` even when it changed
# nothing (`x` on an empty line, `rX` on an X). `J` stores the count it
# joined with (`9Jgg.`).
[[group]]
id = "dot/basic"
tier = 1
keys = ["x.", "x..", "dw.", "dd.", "ciwX<Esc>w.", "AX<Esc>j.", "oX<Esc>.", "3x.", "3x2.", "d2w.",
        "2d3w.", "2d3w4.", "rX.", "3rXw.", "J.", "xp.", "ddP.", "vld.", "Vjd.", "vlcZ<Esc>w.",
        "vlrXw.", "Vj>.", "xu.", "x.u", "x..u", "iab<Left>c<Esc>.", "cwX<Esc>.", "dt<Space>.",
        "df<Space>;.", "yyp.", "A;<Esc>.", "IX<Esc>j.", "cc<Esc>.", "S  x<Esc>j.", "i<CR><Esc>.",
        "a<BS><Esc>.", "9rX.", "iX<Left><Esc>.", "dw3..", "x2..", "rX3..", "cwX<Esc>2..", "CX<Esc>j.",
        "sX<Esc>w.", "3sX<Esc>w.", "xj.", "Dj.", "rXj.", "9Jgg."]
on = ["words", "json_flat", "json_pretty", "blank_edges", "unicode"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "dot/changes"
tier = 1
keys = ["dw", "de", "db", "d$", "dj", "dG", "dd", "3dd", "x", "X", "D", "diw", "daw", "di{", "da\"",
        "ci{X<Esc>", "cwX<Esc>", "ccX<Esc>", "iX<Esc>", "aX<Esc>", "oX<Esc>", "OX<Esc>", "rX", "J",
        "vld", "Vjd", "vl~", "Vj<", "vlrX", "vlcX<Esc>", "yyp", "yiwP", "CX<Esc>", "sX<Esc>"]
suffixes = [".", "u."]
on = ["words", "json_pretty", "blank_edges"]
at = ["bol", "fnb", "eol"]

# A Visual `.` reselects the same size from the caret (Vim's `redo_VIsual`):
# linewise the same line count; charwise one line the same width in virtual
# columns, more lines the same line count and last-line end column. After
# `$` the end is the line's end, except that Vim 9.1 computes a one-line
# `$` repeat as caret column + MAXCOL - 1, which overflows to column 0 once
# the caret is past virtual column 1 (`v$dlll.`). A linewise replay starts
# at the caret's column, not column 0 (`V~jl.`). `{N}.` keeps the Visual
# command's own count, and the replay does not re-record the size. Visual
# `p` repeats as the Visual `d` it began with, `P` as one into the black-hole
# register (`yiwwvlPw.`). `Vpj.` puts an empty register over a line (Vim's
# `setreg('"', '')` holds one empty line). Also spec §6.2's Visual `u`/`U`
# (the leading `x` satisfies generate.py's `.` lint, which does not count
# Visual `u`/`U` as changes).
[[group]]
id = "dot/visual"
tier = 1
keys = ["vlld$.", "vlld$.0.", "vld3.", "vjdj.", "vjlldj.", "vjhd$.", "v$dj.", "v$dlll.", "lv$dj.",
        "v$jdj.", "v$jhdj.", "vlxj.", "vlDj.", "vlXj.", "vlCX<Esc>j.", "vlSX<Esc>j.", "vlRX<Esc>j.",
        "vlJj.", "Vj>2.", "vl~j.", "xvlUw.", "v$~0vlu3l.", "xVjUj.", "xvjUw.", "vlcX<Esc>j.j.", "vlpw.",
        "Vpj.", "vl2pw.", "vlrXj..", "yiwwvlPw.", "yiwwvlpw.", "V~jl.", "VrXjl.", "VJll.", "Vdll.u",
        "V~ll.u", "Vk~jl."]
on = ["json_pretty", "blank_edges", "tabs", "unicode", "short_last"]
at = ["bol", "mid", "eol"]

# `{N}r<Tab>` under 'expandtab' is Vim's `{N}R<Tab><Esc>` (`nv_replace()`),
# so its `.` is an `R`: it never fails on a short line and types past the
# end (`3r<Tab>j0.`).
[[group]]
id = "dot/replace-tab"
tier = 1
keys = ["3r<Tab>j0.", "3r<Tab>j0.u", "3r<Tab>j0.u<C-r>", "r<Tab>j$.", "2r<Tab>j3.", "3r<Tab>j0.k."]
on = ["short_last", "blank_edges", "tabs"]
at = ["bol", "mid", "eol"]

# --- plan 3b: the yank register "0 (Task 1) -----------------------------------

# A yank writes "0 and the unnamed register; a delete or change only the
# unnamed one, unless it names `"` or `0` (Vim's get_yank_register maps both
# to register 0). Visual p and P leave "0 alone. The oracle captures only
# the unnamed register, so "0 is observed through "0p and "0P.
[[group]]
id = "registers/zero"
tier = 2
keys = ["yiwdw\"0p", "yiwdwP\"0P", "yiw\"\"dw\"0p", "yiw\"0dw\"0p", "yiw\"0dwp", "\"0yiwwdw\"0P",
        "yiwwviwp\"0p", "yiwwviw\"0p", "yiwwviwP\"0p", "yiwwviw\"0pwviw\"0p", "\"0p", "\"0P",
        "yiwx\"0p.", "yiwx\"0pu.", "yiwcwX<Esc>\"0p", "\"0yiwP", "yyjdd\"0p", "yyjdd\"0P", "yiwjvd\"0P",
        "yiwvly\"0p", "yiwVjd\"0p", "yiw\"0dd\"0p", "\"0yy\"0p", "yiwdd\"0p", "yiwx\"02p",
        "yiwx\"0pu<C-r>", "yiw\"0x\"0p", "yiwv\"0y\"0P", "yiwwvd\"0p"]
on = ["words", "json_pretty", "blank_edges", "unicode"]
at = ["bol", "mid", "eol"]

# --- plan 3b: case (Task 2) ---------------------------------------------------

# Vim's own case rules: `ß` becomes "SS" under gU and Visual U only; `ǅ`
# and `ǈ` count as lower case (gu leaves them); `İ` lowercases to `i`.
[text.case_edges]
lines = ["straße ǅx İı ſ Σς ǈ ÿŸ"]

[text.case_lines]
lines = ["ß ǅ", "  straße", "", "İı ǈ"]

# `~` (notildeop): count chars on the caret's line; fails on an empty line
# (no undo step, the wanted column kept: `$j~k` vs `$jj~k` on short lines).
[[group]]
id = "ops/tilde"
tier = 2
keys = ["~", "3~", "9~", "~~", "~u", "~u<C-r>", "2~.", "3~u", "~j", "$j~k", "~.", "3~2."]
on = ["words", "unicode", "case_edges", "case_lines", "blank_edges", "json_pretty", "empty", "one_char"]
at = ["bol", "mid", "eol"]

[[group]]
id = "ops/case"
tier = 2
keys = ["g~~", "g~g~", "guu", "gugu", "gUU", "gUgU", "gUu", "g~u", "gu~", "gUw", "g~e", "gUiw", "gUaw",
        "gU$", "gu0", "gUj", "gUk", "gUgg", "gugg", "2g~~", "g~2~", "gUi{", "gUfa", "g~%", "gUU.", "gUiwj."]
on = ["words", "json_pretty", "case_edges", "case_lines"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "ops/case-undo"
tier = 2
keys = ["g~~", "gUiw", "guj", "gU$", "3~", "gUU", "~"]
suffixes = ["u", "u<C-r>"]
on = ["words", "json_pretty", "case_lines"]
at = ["bol", "fnb", "eol"]

# Tier-1 Visual ~ u U on Vim's case table, and Visual g~ gu gU.
[[group]]
id = "visual/case-edges"
tier = 2
keys = ["v$~", "v$u", "v$U", "viwU", "Vu", "VU", "vlU", "vlg~", "vlgu", "vlgU", "vjU", "Vj~", "vlg~u"]
on = ["case_edges", "case_lines", "words"]
at = ["bol", "mid", "eol"]

# --- plan 3b: shift (Task 3) --------------------------------------------------

[text.indent]
lines = ["a", "  b", "", "\tc", "    d"]

[[group]]
id = "ops/shift"
tier = 2
keys = [">>", "<<", "3>>", "3<<", ">j", "<j", ">k", ">G", ">gg", "<G", ">w", ">2w", ">l", ">%", "2>>", "9>>",
        ">>..", "<<.", ">>j.", ">i{", "2>j", ">>u", ">>u<C-r>", "<<u<C-r>", ">Gu"]
on = ["indent", "json_pretty", "tabs", "words"]
at = ["bol", "fnb", "eol"]

# --- plan 3b: ge gE, { }, + - <CR> (Task 4) ------------------------------------

# `{ }` stop at empty lines, not blank-only ones (line 5 is two spaces); `ip
# ap` (Task 5) treat blank-only lines as blank.
[text.paras]
lines = ["a", "b", "", "c", "  ", "d", "", "", "e"]

# nroff macro lines and a form feed end paragraphs too (Vim's 'paragraphs'
# and 'sections'); `.x`, `. ` and `.` do not.
[text.nroff]
lines = ["a", ".PP", "b", ".SH x", "c", ".x", "d", "\f", "e", ".H", "f", ". ", "g", "."]

