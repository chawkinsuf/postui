[[group]]
id = "search/patterns"
tier = 2
keys = ["/\\<lt>foo\\><CR>", "/fo*<CR>", "/f.o<CR>", "/^baz<CR>", "/foo$<CR>", "/[fb]a<CR>", "/\\(foo\\|baz\\)<CR>", "/\\d<CR>",
        "/\\s<CR>", "/o\\+<CR>", "/x\\=<CR>", "/x\\?<CR>", "?x\\?<CR>", "/o\\{2}<CR>", "/\\.<CR>", "/a\\/b<CR>", "/*b<CR>", "/^*b<CR>",
        "/[]-]<CR>", "/a[^X]b<CR>", "/[<CR>", "/\\<lt><CR>", "/\\><CR>", "/\\<lt>\\><CR>", "/a \\<lt>b<CR>", "/\\<lt>x<CR>", "/b\\><CR>",
        "/\\<lt>y<CR>", "/\\<lt>.*b<CR>", "/a.*b\\><CR>", "/\\(x\\|r\\)*<CR>", "/\\D<CR>", "/\\S<CR>", "/\\W<CR>", "/\\w<CR>", "/$<CR>",
        "/^<CR>", "/^$<CR>", "/x*<CR>", "/aa<CR>", "?ab<CR>", "/\\(<CR>", "/\\(<CR>n", "/\\(<CR>x", "/o\\{<CR>", "/\\<CR>", "/foo\\<CR>",
        "/\\bfoo<CR>", "/[a-<CR>", "/[]<CR>", "/[^]<CR>", "/b[-]r<CR>", "/b[\\-]r<CR>", "/b[\\\\]r<CR>", "/b[\\^]r<CR>", "/b[\\t]r<CR>",
        "/b[.]r<CR>", "/b[]]r<CR>", "/b[^]]r<CR>", "/b\\|<CR>", "/\\|b<CR>", "/\\(\\)b<CR>", "/b\\)<CR>", "/\\{2}b<CR>", "/\\+b<CR>",
        "/\\(b\\|^f\\)<CR>", "/\\(o$\\|x\\)<CR>", "/\\(^f\\)<CR>", "/o$\\|z<CR>", "/\\(^\\)b<CR>", "/b\\(\\)$<CR>", "/\\(x\\)\\{2}<CR>",
        "/\\d\\+<CR>", "/\\q<CR>", "/\\/<CR>", "?\\?<CR>", "?\\/<CR>", "/\\?<CR>", "/?<CR>", "/r?<CR>", "/foo?<CR>", "?foo/<CR>",
        "/a\\\\r<CR>", "/\\\\<CR>", "/\\~<CR>", "/\\{2,3}<CR>", "/a\\{2,3}b<CR>", "/a\\{2,}b<CR>", "/a\\{,2}b<CR>", "/a\\{}b<CR>",
        "/\\<lt>ab\\>\\<lt><CR>", "/a\\<lt>b<CR>", "/a\\>\\<lt>b<CR>", "/b\\>ar<CR>", "/\\(\\<lt>ba\\)<CR>", "/a[]-]b<CR>", "/a[\\]]b<CR>",
        "/a[[]b<CR>", "/b\\sc<CR>", "/a\\Wb<CR>", "/a\\wb<CR>", "/b[a^]r<CR>", "/b[\\n]r<CR>", "/b[\\.]r<CR>"]
on = ["search", "words", "punct", "quotes", "unicode", "tabs"]
