        "50Gzz<C-d>", "50Gzz<C-u>", "50Gzz<C-f>", "50Gzz<C-b>", "90Gzt<C-f>", "90Gzt<C-f><C-b>",
        "z5x", "z5zzx", "z5ztx", "z0x", "z12<Del>x", "dz5x", "vz5xd"]
on = ["long"]
at = [[1, 1], [50, 1], [100, 1]]

# --- plan 3c: search motions n N * # (Task 10) ---------------------------------------

[text.search]
lines = ["foo bar foo", "baz foo", "foobar a.b a*b", "x×y 日本語x 日本", "... --- a_b", "", "zzz"]

[[group]]
id = "search/ident"
tier = 2
keys = ["*", "#", "*n", "*N", "#n", "#N", "2*", "3*", "*nn", "d*", "c*X<Esc>", "y*P", "v*d", "*vNd", "*d2n", "*2n", "*vn", "*vN",
        "V*d", "*u", "x*.", "d*u", "d*.", "*ggn", "*GN", "x*j.", "n", "N", "9n", "*9n", "#9N", "*x", "#x", "*<Esc>", "d*x",
        "yiwjviwp*", "*0", "#$", "*v", "*V", "*vd", "*hn", "*ln", "*dnu", "*cnX<Esc>", "*ynP", "*vnd", "*vNo", "*3n", "*dN",
        "*Nx", "x*n.", "**", "##", "*#", "#*", "3#", "*vd*", "jnj", "jNj", "j*j"]
on = ["search", "words", "json_pretty", "unicode", "punct", "url", "quotes", "blank_edges", "empty", "one_char", "long"]
at = ["bol", "mid", "eol"]

[[group]]
id = "search/ident-each"
tier = 2
keys = ["*", "#", "*n"]
on = ["search", "punct", "unicode"]
at = ["each"]

# `#` escapes `?`, and `do_search()` keeps it unescaped: `N` after `#`
# searches forward for a literal `?`.
[text.search_question]
lines = ["?? x ??", "a ??", "\\? b \\?"]

[[group]]
id = "search/ident-question"
tier = 2
keys = ["#", "#N", "#n", "*N", "#Nn"]
on = ["search_question"]
at = ["bol", "eol"]

# --- plan 3c: the / and ? prompt (Task 11) ----------------------------------------

# A `<` in a pattern is written <lt>. No case may end in the prompt.
[[group]]
id = "search/prompt"
tier = 2
keys = ["/foo<CR>", "/foo<CR>n", "/foo<CR>nn", "/zzz<CR>", "/zzz<CR>n", "/zzz<CR>x", "?foo<CR>", "?foo<CR>n", "?foo<CR>N",
        "2/foo<CR>", "9/foo<CR>", "/foo<CR>9N", "/foo<CR>3n", "/<CR>", "/foo<CR>/<CR>", "/foo<CR>//<CR>", "/foo<CR>?<CR>",
        "/foo<CR>?<CR>n", "/foo<CR>u", "x/foo<CR>.", "xx/foo<CR>.", "/foo/<CR>", "/fo<CR>", "/o<CR>", "/o<CR>n", "/o<CR>N",
        "/ <CR>", "/a<CR>", "?a<CR>", "/.<CR>", "/x<CR>", "?x<CR>", "/foo<CR>x", "/foo<CR>dd", "/foo<CR>v", "/bar<CR>vn",
        "/foo<CR>jn", "/foo<CR>kN", "G/foo<CR>", "G?foo<CR>", "$/foo<CR>", "$?foo<CR>", "/foo<CR>$n", "/FOO<CR>"]
on = ["search", "words", "json_pretty", "unicode", "quotes", "blank_edges", "empty", "one_char", "long"]
at = ["bol", "mid", "eol"]

[[group]]
id = "search/ops"
tier = 2
keys = ["d/foo<CR>", "c/bar<CR>X<Esc>", "y/foo<CR>P", "v/foo<CR>d", "d?foo<CR>", "d/foo<CR>.", "d/foo<CR>/bar<CR>.", "d/foo<CR>/bar<CR>.n",
        "d/zzz<CR>", "d/zzz<CR>x", "d2/foo<CR>", "2d/foo<CR>", "d/foo<CR>u", "d/foo<CR>u<C-r>", "d/foo<CR>ddu", "V/foo<CR>d",
        "v/foo<CR>", "v?foo<CR>d", "vd?foo<CR>", "d/foo<Esc>x", "d/a<CR>", "c/a<CR>X<Esc>", "y/o<CR>P", "d?a<CR>", "d/<CR>", "d/x*<CR>",
        "d/$<CR>", "d/^<CR>", "d?^<CR>", "d?$<CR>", "d/\\<lt>foo\\><CR>", "gU/o<CR>", ">/foo<CR>", "d/foo<CR>d/foo<CR>", "v/o<CR>o/o<CR>d",
        "d/foo<CR>2.", "d/o<CR>j.", "c/o<CR>Y<Esc>j.", "/bar<CR>d/<CR>/foo<CR>."]
on = ["search", "words", "json_pretty", "unicode", "blank_edges", "empty", "one_char"]
