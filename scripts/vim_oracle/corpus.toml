[text.search_cases]
lines = ["a-b a]b aXb ayb a[b", "a b\tc a_b a-b", "ab aab aaab", "ab-cd ef -a b", "ba\\r foo a~b b-r b]r bxr b^r b.r b\tr",
         "foo bar? foo", "a/b x", "日本語x 日本", "x×y x", "a  b a", "ab ab", "foo bxxr foo", "baz 42"]

[[group]]
