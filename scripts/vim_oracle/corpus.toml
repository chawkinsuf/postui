tier = 1
keys = ["dd", "2dd", "3dd", "9dd", "D", "2D", "9D", "x", "3x", "9x", "X", "3X", "<Del>", "3<Del>",
        "xx", "dddd"]
on = ["words", "json_flat", "json_pretty", "blank_edges", "json_gaps", "one_char", "empty", "tabs", "unicode"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "ops/yank"
tier = 1
keys = ["yw", "ye", "yb", "y$", "y0", "y^", "yj", "yk", "yy", "2yy", "9yy", "Y", "yG", "ygg", "y%",
        "yfa", "yta", "yFa", "yTa", "y3w", "yl", "yh"]
