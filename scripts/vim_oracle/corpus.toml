        "/a\\{2,3}b<CR>", "/a\\{2,}b<CR>", "/a\\{,2}b<CR>", "/a\\{}b<CR>", "/a.*b\\><CR>", "/a.*\\><CR>", "/\\<lt>.*b<CR>", "/\\<lt>x<CR>",
