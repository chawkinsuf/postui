keys = ["iX<Esc>", "aX<Esc>", "IX<Esc>", "AX<Esc>", "oX<Esc>", "OX<Esc>", "i<Esc>", "a<Esc>", "I<Esc>",
        "A<Esc>", "o<Esc>", "O<Esc>", "iab", "aX", "AX<CR>", "iX<CR>Y<Esc>", "A<CR><Esc>", "O<CR><Esc>",
        "i<CR><CR><Esc>", "a<Space><Esc>", "oX<CR>Y<Esc>", "iX<C-[>", "o<Esc>k", "O<Esc>j", "A<CR><Esc>k"]
on = ["words", "json_flat", "json_pretty", "blank_edges", "unicode", "tabs", "empty", "one_char"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "insert/keys"
tier = 1
keys = ["i<BS><Esc>", "a<BS><BS><Esc>", "A<C-w><Esc>", "A<C-u><Esc>", "iab<C-w><Esc>", "iab<C-u><Esc>",
        "iab<C-w><C-w><Esc>", "iab<C-u><C-u><Esc>", "a<Del><Esc>", "A<Del><Esc>", "i<C-h><Esc>",
        "iX<Left>Y<Esc>", "iX<Right>Y<Esc>", "iX<Home>Y<Esc>", "iX<End>Y<Esc>", "iX<Up>Y<Esc>",
        "iX<Down>Y<Esc>", "o<Tab>x<Esc>", "i<Tab><Esc>", "A<Tab><Tab>x<Esc>", "I<C-u>x<Esc>",
        "A<CR><BS><Esc>", "o<BS><Esc>", "A<C-w><C-w><C-w><Esc>", "A <C-w><Esc>", "iX<Left><BS><Esc>",
        "A<CR>x<Up>y<Esc>", "o<Up><Esc>", "A foo <C-w><C-w><Esc>",
        "iab<Left>X<C-w><Esc>", "iab<Left><C-w><Esc>", "iab<Left><Left><Left>X<C-w><Esc>",
        "i<Left>X<C-w><Esc>", "iX<End>Y<C-w><Esc>", "iX<End>Y<C-u><Esc>", "iX<Down>Y<C-w><Esc>",
