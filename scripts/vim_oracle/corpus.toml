# The Vim conformance corpus (spec §6.2). Each [[group]] expands to
# keys × suffixes × texts (`on`) × seats (`at`); `python3
# scripts/vim_oracle/generate.py` runs every case through Vim 9.1 and writes
# crates/postui/tests/vim_conformance/golden.jsonl.
#
# Seats: "bol" "fnb" "mid" "eol" (for each line; texts over 12 lines use the
# first, middle and last), "each" (every char of every line, texts of at most
# 12 lines), "empty" (the first empty line), or [row, col] (1-based chars;
# skipped where the text has no such char). Default: ["bol", "mid", "eol"].
# Keys use Vim notation; <Name>s must be listed in keys.toml. A case may not
# end half-typed, uses '.' only after a change, and never holds : Q K q @ ! &
# or ZZ/ZQ: if a change fails, its typed text runs as Normal commands, so
# typed text uses harmless letters like X and Y.
# status = "later" cases are generated and reported but do not fail the test.
# Budget: the 3a+3b corpus is about 53,000 cases and 9.06 MB of golden file
# (measured 2026-10-01); plan 3c's second wave adds about 12,000 cases,
# most of them small rows on `long`. Keep it under about 12 MB. Prefer named
# seats unless the key's result depends on the char under the caret.

[text.words]
lines = ["foo bar  baz_qux.quux end"]

[text.punct]
lines = ["foo.bar(baz, qux);"]

[text.url]
lines = ["https://api.example.com/v1/users?id=42&name=a%20b#top"]

[text.json_flat]
lines = ['{"a": {"b": 1}, "c": [1, 2], "d": "x y"}']

[text.json_pretty]
lines = ['{', '  "a": {"b": 1},', '  "c": [1, 2, 3],', '  "d": "hello world"', '}']

[text.json_gaps]
lines = ['{', '  "a": 1,', '', '  "b": [', '    2', '  ],', '', '', '  "c": 3', '}']

[text.brackets_deep]
lines = ['f(a[b{c(d)e}f]g)h', '(x [y', '  {z}] w)']

[text.quotes]
lines = ['say "hi" and "a \"b\" c" or "" then', '"k": "v", "k2": "(v2}"', "x = 'one' + 'two'"]

[text.unicode]
lines = ["héllo wörld 日本語 😀 x×y a b"]

[text.blank_edges]
lines = ["", "a", "", "  b  ", ""]

[text.one_char]
lines = ["x"]

[text.empty]
lines = [""]

[text.numbers]
lines = ["id: 41, n: -7, hex: 0x1f, pad: 007"]

[text.tabs]
lines = ["\tone two", "\t\tthree", "four"]

[text.short_last]
lines = ["abcdefgh", "abc"]

# 100 lines, for the window model (plan 3c): `top` is recorded (over 21
# lines), and the seats bol/mid/eol fall on rows 1, 50 and 100. Even rows
# are indented so `ctrl+f`, `H` and friends show their first-non-blank rule.
[text.long]
lines = ["line 1", "  line 2", "line 3", "  line 4", "line 5", "  line 6", "line 7", "  line 8", "line 9", "  line 10",
         "line 11", "  line 12", "line 13", "  line 14", "line 15", "  line 16", "line 17", "  line 18", "line 19", "  line 20",
         "line 21", "  line 22", "line 23", "  line 24", "line 25", "  line 26", "line 27", "  line 28", "line 29", "  line 30",
         "line 31", "  line 32", "line 33", "  line 34", "line 35", "  line 36", "line 37", "  line 38", "line 39", "  line 40",
         "line 41", "  line 42", "line 43", "  line 44", "line 45", "  line 46", "line 47", "  line 48", "line 49", "  line 50",
         "line 51", "  line 52", "line 53", "  line 54", "line 55", "  line 56", "line 57", "  line 58", "line 59", "  line 60",
         "line 61", "  line 62", "line 63", "  line 64", "line 65", "  line 66", "line 67", "  line 68", "line 69", "  line 70",
         "line 71", "  line 72", "line 73", "  line 74", "line 75", "  line 76", "line 77", "  line 78", "line 79", "  line 80",
         "line 81", "  line 82", "line 83", "  line 84", "line 85", "  line 86", "line 87", "  line 88", "line 89", "  line 90",
         "line 91", "  line 92", "line 93", "  line 94", "line 95", "  line 96", "line 97", "  line 98", "line 99", "  line 100"]

# 25 lines: just over the window (23 rows), for the end-of-file quirks of
# `ctrl+f`, `zz` and `M`.
[text.lines25]
lines = ["line 1", "  line 2", "line 3", "  line 4", "line 5", "  line 6", "line 7", "  line 8", "line 9", "  line 10",
         "line 11", "  line 12", "line 13", "  line 14", "line 15", "  line 16", "line 17", "  line 18", "line 19", "  line 20",
         "line 21", "  line 22", "line 23", "  line 24", "line 25"]

# --- harness ---------------------------------------------------------------

[[group]]
id = "harness/smoke"
tier = 1
keys = ["<Esc>", "<Esc><Esc>"]
on = ["words", "punct", "url", "json_flat", "json_pretty", "json_gaps", "brackets_deep",
      "quotes", "unicode", "blank_edges", "one_char", "empty", "numbers", "tabs"]
at = ["bol", "mid", "eol"]

[[group]]
id = "harness/reg"
tier = 1
keys = ["<Esc>"]
on = ["words", "json_pretty"]
at = [[1, 1]]
reg = { text = "q\n", type = "V" }

# --- motions (Task 6) --------------------------------------------------------

[[group]]
id = "motions/hl"
tier = 1
keys = ["h", "l", "3h", "3l", "9l", "<Left>", "<Right>", "<BS>", "<Space>", "3<BS>", "3<Space>",
        "9<Space>", "9<BS>", "lh"]
on = ["words", "json_flat", "unicode", "json_pretty", "blank_edges", "one_char", "empty", "tabs"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "motions/jk"
tier = 1
keys = ["j", "k", "3j", "3k", "9j", "9k", "<Down>", "<Up>", "jj", "jk", "$j", "$jk", "llj", "lljj",
        "0j", "$jj", "$wk", "$ek", "kbj", "2$k", "9$k", "l2$k", "$%k", "$fzk", "$3bj", "j<C-r>k", "juk"]
on = ["json_pretty", "json_gaps", "blank_edges", "tabs", "brackets_deep", "words", "json_flat", "unicode",
      "short_last"]
at = ["bol", "mid", "eol"]

[[group]]
id = "motions/line"
tier = 1
keys = ["0", "^", "$", "<Home>", "<End>", "2$", "3$", "9$", "$0", "10l0", "$^"]
on = ["words", "json_flat", "json_pretty", "blank_edges", "tabs", "unicode"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "motions/file"
tier = 1
keys = ["gg", "G", "2G", "2gg", "9G", "9gg", "Gk", "ggj", "3G$", "G$gg"]
on = ["json_pretty", "json_gaps", "blank_edges", "tabs", "words", "json_flat", "unicode"]
at = ["bol", "mid", "eol"]

[[group]]
id = "motions/word"
tier = 1
keys = ["w", "b", "e", "W", "B", "E", "3w", "3b", "3e", "2W", "2B", "2E", "9w", "9b", "9e", "ee", "bb"]
