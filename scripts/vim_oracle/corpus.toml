        "cT<Space>X<Esc>", "c%X<Esc>", "cGX<Esc>", "cw<Esc>", "c<Space>X<Esc>"]
on = ["words", "json_flat", "json_pretty", "blank_edges", "unicode", "tabs"]
at = ["bol", "fnb", "mid", "eol"]

[[group]]
id = "ops/change-cw"
