tier = 1
keys = ["dw", "de", "db", "dW", "dE", "dB", "d$", "d0", "d^", "dh", "dl", "dj", "dk", "dgg", "dG",
        "d%", "df<Space>", "dt<Space>", "dF<Space>", "dT<Space>", "d<Space>", "d<BS>", "2d<Space>",
        "d3w", "3dw", "2d2w", "d9w", "d9b", "d9e", "d2j", "d9k", "d;", "dfad;", "d3l", "d9l", "d9h"]
