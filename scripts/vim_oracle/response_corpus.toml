# The response pane's vim keys against real Vim 9.1 (response.py). Each
# group runs its cases on one body; a case is the keys typed from line 1,
# column 1, with the view at the top. Ids are `group/keys`.
#
# Raw bodies are lines as they are. Pretty bodies are JSON the pane
# pretty-prints; Vim gets the same lines (two-space indent) with one fold per
# container, all open.

[body.raw30]
view = "raw"
lines = [
  "foo bar baz",
  "  bar foo",
  "    baz",
  "",
  "foo.bar(baz)",
  "  item_1 = foo",
  "  item_2 = bar",
  "x",
  "naïve café foo",
  "    deep   indent foo",
  "bar",
  "",
  "   ",
  "foo foo foo",
  "the end of foo",
  "line 16 bar",
  "line 17 foo",
  "  line 18 baz",
  "line 19 bar",
  "line 20 foo",
  "line 21 bar",
  "    line 22 baz",
  "line 23 foo",
  "line 24 bar",
  "line 25 foo",
  "  line 26 baz",
  "line 27 bar",
  "line 28 foo",
  "line 29 bar",
  "  last foo line",
]

[body.raw5]
view = "raw"
lines = ["one foo", "  two", "three foo", "", "  five"]

[body.one]
view = "raw"
lines = ["only foo line"]

[body.wide]
view = "raw"
lines = ["\tfoo\tbar", "日本語 foo bar", "ab\tcd foo", "plain text with foo here", "\t\tdeep", "x"]

[body.tree]
view = "pretty"
json = '''{"id": 1, "name": "foo", "tags": ["a", "b", "foo"], "owner": {"name": "bar", "email": "foo@x.test", "roles": ["admin", "dev"]}, "items": [{"id": 1, "name": "foo"}, {"id": 2, "name": "bar"}, {"id": 3, "name": "baz"}], "meta": {"a": {"b": {"c": "foo"}}}, "count": 3, "next": null, "tail": "foo"}'''

[body.small]
view = "pretty"
json = '''{"a": {"b": {"c": 1}, "d": 2}, "e": [1, 2]}'''

[[group]]
id = "move"
body = "raw30"
cases = [
  "j", "k", "5j", "40j", "G", "gg", "5G", "99G", "5gg", "Gk", "Gj", "Ggg",
  "10G3k", "10G30k", "<Down>", "<Up>", "3<Down>", "10G2<Up>",
  "<C-End>", "<C-End><C-Home>", "5<C-Home>", "5<C-End>",
]

[[group]]
id = "move5"
body = "raw5"
cases = ["j", "9j", "G", "Gk", "G9k", "gg", "3G", "9G"]

[[group]]
id = "column"
body = "raw30"
cases = [
  "$", "$j", "$jj", "$G", "$gg", "$<C-d>", "$5G",
  "0", "$0", "l", "3l", "$h", "3lj", "3lG",
  "/baz<CR>", "/baz<CR>j", "/baz<CR>jj", "/baz<CR>k", "/baz<CR>G", "/baz<CR><C-d>",
  "/baz<CR>0", "/baz<CR>$", "/baz<CR>zt", "/baz<CR>10zt", "/baz<CR><CR>", "/baz<CR><Space>",
  "/indent<CR>j", "/café<CR>j",
]

