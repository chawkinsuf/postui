  "3h", "$3h", "$9h", "5l", "99l", "$l", "<Right>", "3<Right>", "$<Left>", "$<Home>", "<End>", "3<End>", "2$", "29G3$", "30G2$",
  "$k", "$G", "$<C-d>", "$<C-f>", "$zt", "$10zt", "$10zz", "$Gk", "$<C-End>k", "$0j", "$jj0", "3ljjj", "3lG3k",
  "/item<CR>j", "/item<CR>jjj", "/item<CR>$j", "/foo<CR>n", "/foo<CR>jn", "/foo<CR>jN", "$n", "$N", "$*", "0#",
