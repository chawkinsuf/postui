[workspace]
resolver = "2"
members = ["crates/postui-core", "crates/postui"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
toml_edit = "0.23"
tempfile = "3"
directories = "6"
