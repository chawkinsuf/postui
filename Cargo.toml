[workspace]
resolver = "2"
members = ["crates/postui-core", "crates/postui"]

[workspace.package]
edition = "2024"
version = "0.1.1-rc.1"
# The toolchain the code is built and tested with. rust-toolchain.toml pins
# the exact release (local, CI and release builds all use it); this is its
# minor version, so an older compiler says so instead of failing somewhere
# in the build.
rust-version = "1.97"
# dist reads these for the GitHub Release and the Homebrew formula.
repository = "https://github.com/chawkinsuf/postui"
homepage = "https://github.com/chawkinsuf/postui"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
toml_edit = "0.23"
tempfile = "3"
directories = "6"
form_urlencoded = "1"
# The URL parser reqwest itself uses (already in the lock file as its
# dependency): core derives the `Host` the client will send with it.
url = "2"
# The decoder reqwest uses on a URL's userinfo (already in the lock file as
# url's dependency): core derives the client's `Authorization` with it.
percent-encoding = "2"
jaq-core = "3"
jaq-std = "3"
jaq-json = { version = "2", features = ["sync"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
