[workspace]
members = ["cargo:."]

# Config for 'dist' (https://axodotdev.github.io/cargo-dist/book/). It
# generates .github/workflows/release.yml: after a change here or a dist
# upgrade, run `dist generate` and commit the result; never edit release.yml
# by hand (docs/releasing.md).
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# Only the app is released; postui-core is its library.
packages = ["postui"]
# CI backends to support
ci = "github"
# No pull requests here (branches merge into main locally), so release.yml
# gets no pull_request trigger.
pr-run-mode = "skip"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# The tap the formula is pushed to, by the homebrew publish job with the
# HOMEBREW_TAP_TOKEN secret.
tap = "chawkinsuf/homebrew-postui"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). No
# Windows for 1.0. Linux is glibc, not musl: onig_sys, aws-lc-sys and ring
# build C, which musl makes harder for little gain.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# A release tag runs the same gates as a push to main (checks.yml), next to
# the builds, and nothing is published unless they pass. A local-artifacts
# job, not a plan job: dist's `host` job needs local-artifacts jobs to
# succeed, while a failed plan job only skips the builds, and `host` runs
# after skipped builds. The cost is that a failing tag still spends the
# build runners.
local-artifacts-jobs = ["./checks"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# Named outright so a dist upgrade that changes its defaults can't move a
# build. Both macOS targets build on the arm64 runner (x86_64 by cross
# compiling). Linux builds on Ubuntu 22.04, so the binaries need glibc 2.35
# or newer; arm64 Linux builds natively on GitHub's arm runner. When GitHub
# retires the 22.04 images (22.04's standard support ends April 2027), move
# to the next LTS here, which raises the glibc floor (docs/releasing.md).
[dist.github-custom-runners]
global = "ubuntu-22.04"
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = { runner = "macos-14", host = "aarch64-apple-darwin" }
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
